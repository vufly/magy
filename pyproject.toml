[project]
name = "magy"
version = "0.1.0"
description = "Agy launcher and MCP orchestrator with profile isolation and round-robin routing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nguyen Dinh Vu", email = "nguyendinhvu@msn.com" }
]
dependencies = [
    "filelock>=4.0.0",
    "mcp>=2.2.0",
    "platformdirs>=4.11.10",
    "psutil>=7.0.0",
    "pydantic>=2.13.0",
]

[project.scripts]
magy = "magy.cli:main"
magy-mcp = "magy.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
